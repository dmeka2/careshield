[project]
name = "careshield"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DeepikaMeka", email = "mekadeepikasaimani@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "spacy>=3.8.16",
    "streamlit>=1.65.0",
    "textstat>=0.7.13",
    "tldextract>=5.4.0",
    "uvicorn>=0.54.0",
    "whoisit>=4.0.5",
]

[project.scripts]
careshield = "careshield:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
[tool.uv.build-backend]
module-root = ""
